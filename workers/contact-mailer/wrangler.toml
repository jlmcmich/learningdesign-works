"$schema" = "../../node_modules/wrangler/config-schema.json"

# Sends contact form messages from the learningdesign.works Pages site.
# Pages Functions can't use send_email bindings, so the site calls this
# Worker through a service binding. It has no public URL.
name = "ldw-contact-mailer"
main = "index.js"
compatibility_date = "2026-06-02"
workers_dev = false
preview_urls = false

[[send_email]]
name = "SEND_EMAIL"

# CONTACT_TO (the verified Email Routing destination) is a Worker secret,
# not committed here: wrangler secret put CONTACT_TO
